name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        run: curl -fsSL https://bun.sh/install | bash

      - name: Install dependencies
        run: $HOME/.bun/bin/bun install --frozen-lockfile

      - name: Build Linux x64
        run: $HOME/.bun/bin/bun build src/cli.ts --compile --outfile dist/algori-linux-x64

      - name: Build Linux arm64
        run: $HOME/.bun/bin/bun build src/cli.ts --compile --outfile dist/algori-linux-arm64 --target=bun-linux-arm64

      - name: Build macOS arm64
        run: $HOME/.bun/bin/bun build src/cli.ts --compile --outfile dist/algori-macos-arm64 --target=bun-darwin-arm64

      - name: Build macOS x64
        run: $HOME/.bun/bin/bun build src/cli.ts --compile --outfile dist/algori-macos-x64 --target=bun-darwin-x64

      - name: Build Windows x64
        run: $HOME/.bun/bin/bun build src/cli.ts --compile --outfile dist/algori-windows-x64.exe --target=bun-windows-x64

      - name: Upload all executables
        uses: actions/upload-artifact@v7
        with:
          name: executables
          path: dist/algori-*

  build-windows-installer:
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download executables
        uses: actions/download-artifact@v8
        with:
          name: executables
          path: dist

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\windows\algori.iss"

      - name: Calculate SHA256
        id: sha256
        shell: pwsh
        run: |
          $file = Get-ChildItem dist/algori-*-setup.exe | Select-Object -First 1
          $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLower()
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/algori-*-setup.exe

      - name: Upload SHA256
        uses: actions/upload-artifact@v7
        with:
          name: sha256
          path: dist/wanfranklin.algori.yaml

  build-deb:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download executables
        uses: actions/download-artifact@v8
        with:
          name: executables
          path: dist

      - name: Build .deb
        run: |
          VER=${VERSION#v}
          mkdir -p pkg/DEBIAN pkg/usr/bin pkg/usr/share/doc/algori
          cp dist/algori-linux-x64 pkg/usr/bin/algori
          chmod 755 pkg/usr/bin/algori
          cat > pkg/DEBIAN/control << EOF
          Package: algori
          Version: ${VER}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libc6 (>= 2.14)
          Maintainer: Wanfranklin Alves <wanfranklin@users.noreply.github.com>
          Homepage: https://github.com/wanfranklin/algori
          Description: Linguagem de programação em português
           Algori é uma linguagem de pseudocódigo educacional
           com palavras reservadas em português.
          EOF
          cp packaging/debian/usr/share/doc/algori/* pkg/usr/share/doc/algori/
          dpkg-deb --build pkg "algori_${VER}_amd64.deb"

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: deb-package
          path: algori_*_amd64.deb

  release:
    needs: [build, build-windows-installer, build-deb]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: |
            dist/executables/algori-linux-x64
            dist/executables/algori-linux-arm64
            dist/executables/algori-macos-arm64
            dist/executables/algori-macos-x64
            dist/executables/algori-windows-x64.exe
            dist/windows-installer/algori-*-setup.exe
            dist/deb-package/algori_*_amd64.deb
          generate_release_notes: true
